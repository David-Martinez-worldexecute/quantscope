<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
<title id="title">How much of the ternary cost label-column isolation wins back</title>
<desc id="desc">MNIST 64.1%, CIFAR-10 (20k) 99.1%, CIFAR-10 (50k) 97.3%.</desc>
<rect width="760" height="420" fill="#0f1115"/>
<rect x="16" y="16" width="728" height="388" rx="12" fill="#151922" stroke="#252a34"/>
<text x="40.0" y="56.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" fill="#eef1f6" text-anchor="start" font-weight="bold">How much of the ternary cost label-column isolation wins back</text>
<text x="40.0" y="80.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#98a2b3" text-anchor="start" font-weight="normal">share of the FP32→ternary gap recovered by splitting the input scale per column group</text>
<line x1="96.0" y1="320.0" x2="712.0" y2="320.0" stroke="#252a34" stroke-width="1"/>
<text x="84.0" y="324.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#98a2b3" text-anchor="end" font-weight="normal">0%</text>
<line x1="96.0" y1="270.0" x2="712.0" y2="270.0" stroke="#252a34" stroke-width="1"/>
<text x="84.0" y="274.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#98a2b3" text-anchor="end" font-weight="normal">28%</text>
<line x1="96.0" y1="220.0" x2="712.0" y2="220.0" stroke="#252a34" stroke-width="1"/>
<text x="84.0" y="224.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#98a2b3" text-anchor="end" font-weight="normal">55%</text>
<line x1="96.0" y1="170.0" x2="712.0" y2="170.0" stroke="#252a34" stroke-width="1"/>
<text x="84.0" y="174.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#98a2b3" text-anchor="end" font-weight="normal">82%</text>
<line x1="96.0" y1="120.0" x2="712.0" y2="120.0" stroke="#252a34" stroke-width="1"/>
<text x="84.0" y="124.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#98a2b3" text-anchor="end" font-weight="normal">110%</text>
<rect x="153.5" y="203.4" width="90.3" height="116.6" rx="4" fill="#5b8def"/>
<text x="198.7" y="193.4" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#eef1f6" text-anchor="middle" font-weight="bold">64.1%</text>
<text x="198.7" y="342.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#98a2b3" text-anchor="middle" font-weight="normal">MNIST, 794 inputs</text>
<rect x="358.8" y="139.8" width="90.3" height="180.2" rx="4" fill="#f0b64a"/>
<text x="404.0" y="129.8" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#eef1f6" text-anchor="middle" font-weight="bold">99.1%</text>
<text x="404.0" y="342.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#98a2b3" text-anchor="middle" font-weight="normal">CIFAR-10, 20k images</text>
<rect x="564.2" y="143.0" width="90.3" height="177.0" rx="4" fill="#5cc4a0"/>
<text x="609.3" y="133.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#eef1f6" text-anchor="middle" font-weight="bold">97.3%</text>
<text x="609.3" y="342.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#98a2b3" text-anchor="middle" font-weight="normal">CIFAR-10, 50k images</text>
<text x="96.0" y="372.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#98a2b3" text-anchor="start" font-weight="normal">Leftover gap to FP32: MNIST 1.66 pp, CIFAR-10 (20k) 0.10 pp, (50k) 0.43 pp</text>
<text x="96.0" y="390.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#98a2b3" text-anchor="start" font-weight="normal">Equal-width groups that cut through the label columns recover almost nothing.</text>
</svg>