<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
<title id="title">Accuracy against payload, on one CPU</title>
<desc id="desc">Each format's accuracy against the payload it needs, with the interval over questions. Where the bars overlap, the ordering between those two formats is not a result.</desc>
<rect width="760" height="420" fill="#0f1115"/>
<rect x="16" y="16" width="728" height="388" rx="12" fill="#151922" stroke="#252a34"/>
<text x="40.0" y="56.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" fill="#eef1f6" text-anchor="start" font-weight="bold">Accuracy against payload, on one CPU</text>
<text x="40.0" y="80.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#98a2b3" text-anchor="start" font-weight="normal">Qwen3-0.6B, 171 questions, one run per format; bars are 95% bootstrap intervals (seed 12345, 4000 resamples over questions)</text>
