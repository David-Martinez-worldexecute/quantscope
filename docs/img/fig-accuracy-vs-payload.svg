<text x="136.4" y="276.1" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#5cc4a0" text-anchor="start" font-weight="bold">ternary g64 · 24.6%</text>
<text x="40.0" y="362.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#98a2b3" text-anchor="start" font-weight="normal">Payload is computed from the stored parameter shapes (1, 0.5 and 0.25 bytes per weight, plus a 4-byte scale per 64-value group), not measured RSS.</text>
<text x="40.0" y="380.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#98a2b3" text-anchor="start" font-weight="normal">The 4- and 2-bit rows are simulated in float32: that payload is what a real kernel would need, not what this process holds.</text>
</svg>