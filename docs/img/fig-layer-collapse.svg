<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
<title id="title">Where the ternary model stops answering</title>
<desc id="desc">Bar chart: for N from 12 to 28, the share of the sixty answers that went to the most common letter when the first N transformer layers are ternarised. Bars are coloured by the letter that dominated. The first collapse is at 18 layers, the model spreads out again from 19 to 22, and from 23 layers on it collapses onto D.</desc>
<rect width="760" height="420" fill="#0f1115"/>
<rect x="16" y="16" width="728" height="388" rx="12" fill="#151922" stroke="#252a34"/>
<text x="40.0" y="56.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" fill="#eef1f6" text-anchor="start" font-weight="bold">Where the ternary model stops answering</text>
<text x="40.0" y="80.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#98a2b3" text-anchor="start" font-weight="normal">Sixty questions, one layer deeper at a time; a bar is how often one letter was chosen</text>
<line x1="96.0" y1="316.0" x2="712.0" y2="316.0" stroke="#252a34" stroke-width="1"/>
<text x="84.0" y="320.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#98a2b3" text-anchor="end" font-weight="normal">0%</text>
<line x1="96.0" y1="270.0" x2="712.0" y2="270.0" stroke="#252a34" stroke-width="1"/>
<text x="84.0" y="274.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#98a2b3" text-anchor="end" font-weight="normal">25%</text>
<line x1="96.0" y1="224.0" x2="712.0" y2="224.0" stroke="#252a34" stroke-width="1"/>
<text x="84.0" y="228.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#98a2b3" text-anchor="end" font-weight="normal">50%</text>
<line x1="96.0" y1="178.0" x2="712.0" y2="178.0" stroke="#252a34" stroke-width="1"/>
<text x="84.0" y="182.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#98a2b3" text-anchor="end" font-weight="normal">75%</text>
<line x1="96.0" y1="132.0" x2="712.0" y2="132.0" stroke="#252a34" stroke-width="1"/>
<text x="84.0" y="136.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#98a2b3" text-anchor="end" font-weight="normal">100%</text>
