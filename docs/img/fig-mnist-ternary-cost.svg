<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
<title id="title">Ternary weights on MNIST: where the 4.62 pp goes</title>
<desc id="desc">FP32 94.14 percent, aligned groups 92.49 percent, one scale per row 89.52 percent.</desc>
<rect width="760" height="420" fill="#0f1115"/>
<rect x="16" y="16" width="728" height="388" rx="12" fill="#151922" stroke="#252a34"/>
<text x="40.0" y="56.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" fill="#eef1f6" text-anchor="start" font-weight="bold">Ternary weights on MNIST: where the 4.62 pp goes</text>
<text x="40.0" y="80.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#98a2b3" text-anchor="start" font-weight="normal">2-layer forward-forward MLP, 500 hidden units, 10,000 test images, 3 seeds</text>
<line x1="96.0" y1="330.0" x2="712.0" y2="330.0" stroke="#252a34" stroke-width="1"/>
<text x="84.0" y="334.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#98a2b3" text-anchor="end" font-weight="normal">86%</text>
<line x1="96.0" y1="277.5" x2="712.0" y2="277.5" stroke="#252a34" stroke-width="1"/>
<text x="84.0" y="281.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#98a2b3" text-anchor="end" font-weight="normal">88%</text>
<line x1="96.0" y1="225.0" x2="712.0" y2="225.0" stroke="#252a34" stroke-width="1"/>
<text x="84.0" y="229.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#98a2b3" text-anchor="end" font-weight="normal">91%</text>
<line x1="96.0" y1="172.5" x2="712.0" y2="172.5" stroke="#252a34" stroke-width="1"/>
<text x="84.0" y="176.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#98a2b3" text-anchor="end" font-weight="normal">93%</text>
<line x1="96.0" y1="120.0" x2="712.0" y2="120.0" stroke="#252a34" stroke-width="1"/>
<text x="84.0" y="124.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#98a2b3" text-anchor="end" font-weight="normal">96%</text>
<rect x="153.5" y="156.9" width="90.3" height="173.1" rx="4" fill="#5b8def"/>
<text x="198.7" y="146.9" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#eef1f6" text-anchor="middle" font-weight="bold">94.14%</text>
<text x="198.7" y="352.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#98a2b3" text-anchor="middle" font-weight="normal">FP32 (reference)</text>
<rect x="358.8" y="192.1" width="90.3" height="137.9" rx="4" fill="#5cc4a0"/>
<text x="404.0" y="182.1" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#eef1f6" text-anchor="middle" font-weight="bold">92.49%</text>
<text x="404.0" y="352.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#98a2b3" text-anchor="middle" font-weight="normal">ternary + 11 aligned groups</text>
<rect x="564.2" y="255.1" width="90.3" height="74.9" rx="4" fill="#e2686b"/>
<text x="609.3" y="245.1" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#eef1f6" text-anchor="middle" font-weight="bold">89.52%</text>
<text x="609.3" y="352.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#98a2b3" text-anchor="middle" font-weight="normal">ternary, one scale per row</text>
<text x="96.0" y="372.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#98a2b3" text-anchor="start" font-weight="normal">Cost of ternarizing at all: −4.62 pp</text>
<text x="96.0" y="390.0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#98a2b3" text-anchor="start" font-weight="normal">Isolating the 10 label columns wins back 2.96 pp = 64.1% of that cost</text>
</svg>